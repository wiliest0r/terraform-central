name: Terraform GitOps & Cloud Delivery

on:
  push:
    branches: [ develop, stage, main ]
  pull_request:
    branches: [ develop, stage, main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to apply"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Init (Static Validation)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  speculative-plan:
    name: HCP Speculative Plan
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Workspace
        id: ws
        run: |
          if [ "${{ github.base_ref }}" == "develop" ]; then
            echo "workspace=terraform-central-dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.base_ref }}" == "stage" ]; then
            echo "workspace=terraform-central-stage" >> $GITHUB_OUTPUT
          elif [ "${{ github.base_ref }}" == "main" ]; then
            echo "workspace=terraform-central-prod" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        env:
          TF_WORKSPACE: ${{ steps.ws.outputs.workspace }}
        run: terraform init -input=false

      - name: Terraform Speculative Plan
        env:
          TF_WORKSPACE: ${{ steps.ws.outputs.workspace }}
        run: terraform plan -input=false

  apply-dev:
    name: Deploy to Dev
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        env:
          TF_WORKSPACE: terraform-central-dev
        run: terraform init -input=false

      - name: Terraform Apply
        env:
          TF_WORKSPACE: terraform-central-dev
        run: terraform apply -input=false -auto-approve

  apply-stage:
    name: Deploy to Stage
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/stage') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'stage')
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        env:
          TF_WORKSPACE: terraform-central-stage
        run: terraform init -input=false

      - name: Terraform Apply
        env:
          TF_WORKSPACE: terraform-central-stage
        run: terraform apply -input=false -auto-approve

  apply-prod:
    name: Deploy to Prod
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        env:
          TF_WORKSPACE: terraform-central-prod
        run: terraform init -input=false

      - name: Terraform Apply
        env:
          TF_WORKSPACE: terraform-central-prod
        run: terraform apply -input=false -auto-approve
